name: Build Bootloader

on:
  workflow_dispatch:
    inputs:
      lk2nd_target:
        description: 'Target bootloader project to build'
        required: true
        default: 'lk2nd-msm8916-boardport'
        type: string
      lk2nd_ref:
        description: 'Upstream lk2nd release tag or branch'
        required: true
        default: '23.1'
        type: choice
        options:
          - '23.1'
          - '23.0'
          - '22.0'
          - '21.0'
          - '20.0'
          - '19.0'
          - '18.1'
          - '18.0'
          - '17.0'
          - 'main'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_bootloader.yml'
      - 'overlay/**'

permissions:
  contents: read

jobs:
  build-bootloader:
    name: Build Bootloader (${{ inputs.lk2nd_target || 'lk2nd-msm8916-boardport' }} / ${{ inputs.lk2nd_ref || '23.1' }})
    runs-on: ubuntu-latest
    steps:
      # ---
      - name: Checkout repository
        id: checkout-repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
          submodules: recursive
      # ---
      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
      # ---
      - name: Build toolchain container image
        run: |
          make lk2nd-build-toolchain LK2ND_REF=${{ inputs.lk2nd_ref || '23.1' }}
      # ---
      - name: Compile target bootloader
        run: |
          make lk2nd-build LK2ND_REF=${{ inputs.lk2nd_ref || '23.1' }} LK2ND_TARGET=${{ inputs.lk2nd_target || 'lk2nd-msm8916-boardport' }}
      # ---
      - name: Upload bootloader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lk2nd_target || 'lk2nd-msm8916-boardport' }}-${{ inputs.lk2nd_ref || '23.1' }}-artifacts
          path: docker/volumes/output/
          if-no-files-found: error
