name: Build Toolbox Image

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian base image version'
        required: true
        default: '13.6'
        type: string
      debian_latest:
        description: 'Tag image as latest'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_toolbox.yml'
      - 'docker/images/toolchain/Dockerfile.debian'
      - 'docker/images/toolchain/docker-entrypoint.sh'

env:
  docker_image: 'boardport/lk2nd-toolbox'

permissions:
  contents: read
  packages: write

jobs:
  build-toolbox:
    name: Build Toolbox Image
    runs-on: ubuntu-latest
    steps:
      # ---
      - name: Checkout repository
        id: checkout-repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
          submodules: recursive
      # ---
      - name: Setup QEMU
        id: setup-qemu
        uses: docker/setup-qemu-action@v4
      # ---
      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
      # ---
      - name: Log in to GitHub Container Registry
        id: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
      # ---
      - name: Extract metadata (tags, labels) for Docker
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.docker_image }}
          tags: |
            type=raw,value=debian${{ inputs.debian_version || '13.6' }}
            type=raw,value=debian,enable=${{ inputs.debian_latest == true }}
            type=raw,value=latest,enable=${{ inputs.debian_latest == true }}
          labels: |
            org.opencontainers.image.title=${{ env.docker_image }}:debian${{ inputs.debian_version || '13.6' }}
            org.opencontainers.image.description=Base Debian compilation environment for lk2nd build tools
            org.opencontainers.image.vendor=BoardPort Community <boardport@proton.me>
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      # ---
      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/images/toolchain/Dockerfile.debian
          target: toolbox
          push: true
          platforms: linux/amd64
          build-args: |
            DEBIAN_SHORT_VERSION=${{ inputs.debian_version || '13.6' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox
