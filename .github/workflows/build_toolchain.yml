name: Build Toolchain Image

on:
  workflow_dispatch:
    inputs:
      lk2nd_ref:
        description: 'Upstream lk2nd release tag or branch'
        required: true
        default: '23.1'
        type: string
      lk2nd_commit:
        description: 'Optional exact 40-character commit SHA (overrides ref if set)'
        required: false
        default: ''
        type: string
      lk2nd_latest:
        description: 'Tag image as latest'
        type: boolean
        required: false
        default: false

env:
  docker_image: 'boardport/lk2nd-toolchain'

permissions:
  contents: read
  packages: write

jobs:
  build-toolchain:
    name: Build Toolchain (lk2nd:${{ inputs.lk2nd_ref }})
    runs-on: ubuntu-latest
    steps:
      # ---
      - name: Checkout repository
        id: checkout-repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
          submodules: recursive
      # ---
      - name: Setup QEMU
        id: setup-qemu
        uses: docker/setup-qemu-action@v4
      # ---
      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
      # ---
      - name: Log in to GitHub Container Registry
        id: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
      # ---
      - name: Extract metadata (tags, labels) for Docker
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.docker_image }}
          tags: |
            type=raw,value=${{ inputs.lk2nd_ref }}
            type=raw,value=latest,enable=${{ inputs.lk2nd_latest == true }}
          labels: |
            org.opencontainers.image.title=${{ env.docker_image }}:${{ inputs.lk2nd_ref }}
            org.opencontainers.image.description=lk2nd bootloader toolchain and upstream source tree
            org.opencontainers.image.vendor=BoardPort Community <boardport@proton.me>
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      # ---
      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/images/toolchain/Dockerfile.debian
          target: toolchain
          push: true
          platforms: linux/amd64
          build-args: |
            LK2ND_REF=${{ inputs.lk2nd_ref }}
            LK2ND_COMMIT=${{ inputs.lk2nd_commit || '' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
